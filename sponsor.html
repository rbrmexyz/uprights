<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uprights — Sponsor a spot</title>
  <meta name="description" content="Put your brand in the Uprights stadium: the net, the post pad, the ball, the boards.">
  <link rel="icon" href="media/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1790631535">
</head>
<body>
  <div class="page-wrap">
    <header class="endzone">
      <a class="wordmark-link fade-in" href="./" aria-label="Uprights home">
        <svg class="wordmark" viewBox="0 0 1000 118" role="img" aria-hidden="true">
          <text x="0" y="116" font-size="157" textLength="1000" lengthAdjust="spacing">UPRIGHTS</text>
        </svg>
      </a>
    </header>

    <main>
      <div class="field"><span class="row-probe"></span>
        <section class="spots">
          <div class="app-view">
            <div class="phone still">
              <div class="screen">
                <img src="media/sponsored.jpg" alt="The Uprights stadium with every sponsor spot filled with sample brands">
                <span class="spot-ring" id="ring" aria-hidden="true"></span>
              </div>
            </div>
          </div>

          <div class="picker">
            <h1>Pick a sponsor spot</h1>
            <ul class="slots" id="slots"></ul>
            <div class="detail" id="detail" aria-live="polite"></div>
            <p class="plain-note">Spots nobody books stay plain stadium, so the game never looks like a billboard. Artwork swaps in without an app update.</p>
            <a class="button" id="book" href="https://github.com/rbrmexyz/uprights/issues/new?title=Sponsor%3A%20The%20net">Book this spot</a>
          </div>
        </section>
      </div>

    </main>

    <footer class="site endzone">
      <nav aria-label="Footer">
        <a href="privacy.html">Privacy policy</a>
        <a href="./">Home</a>
        <a href="https://github.com/rbrmexyz/uprights/issues/new?title=Bug%3A%20">Report a bug</a>
        <a href="terms.html">Terms</a>
        <a href="support.html">Support</a>
        <a href="https://apps.apple.com/app/id6817074074">Download</a>
      </nav>
    </footer>
  </div>

  <script>
    const slots = [
      { id: "net", at: [7, 10.2, 86, 36.4],    name: "The net",     hint: "Every kick",  about: "The whole net behind the posts carries your logo. It's framed by the uprights on every single kick, and it billows when the ball hits it.", spec: "Transparent PNG, 1024×410" },
      { id: "pad", at: [46.8, 48.4, 6, 8.4],    name: "Post pad",    hint: "Full wrap",   about: "Your colour wraps the goal post pad top to bottom, with your logo running up the side that faces the kicker.", spec: "Logo 512×128, or a full wrap 1024×920" },
      { id: "ball", at: [44.4, 73.2, 11.2, 8.2],   name: "The ball",    hint: "In flight",   about: "Printed along a panel of the ball. It tumbles end over end through every kick.", spec: "Transparent PNG, 512×128" },
      { id: "tee", at: [45, 80.8, 10, 3.8],    name: "The tee",     hint: "Under thumb", about: "The kicking tee in your colours, right where every player puts their thumb.", spec: "Logo 512×128" },
      { id: "video", at: [16.5, 13.6, 68, 10],  name: "Video board", hint: "Scoreboard",  about: "A strip under the streak, attempt and wind: “This kick brought to you by…”", spec: "1068×64" },
      { id: "ribbon", at: [0, 33.4, 100, 2.4], name: "LED ribbon",  hint: "Scrolling",   about: "The glowing ribbon between the tiers, scrolling your message around the stadium.", spec: "1024×48" },
      { id: "wall", at: [0, 50.8, 100, 2.6],   name: "Wall boards", hint: "Field level", about: "Four LED boards along the field wall, right behind the end zone.", spec: "256×44 each, up to 4" },
    ];
    const list = document.getElementById("slots");
    const detail = document.getElementById("detail");
    const book = document.getElementById("book");
    const ring = document.getElementById("ring");

    function select(id) {
      const s = slots.find(x => x.id === id);
      list.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
      detail.innerHTML = "";
      const h = document.createElement("h2"); h.textContent = s.name;
      const p = document.createElement("p"); p.textContent = s.about;
      const sp = document.createElement("p"); sp.className = "spec"; sp.textContent = "Artwork: " + s.spec;
      detail.append(h, p, sp);
      const r = s.at;
      Object.assign(ring.style, { left: r[0] + "%", top: r[1] + "%", width: r[2] + "%", height: r[3] + "%" });
      book.href = "https://github.com/rbrmexyz/uprights/issues/new?title=" + encodeURIComponent("Sponsor: " + s.name);
    }
    for (const s of slots) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = s.id;
      b.append(s.name);
      b.addEventListener("click", () => select(s.id));
      li.append(b);
      list.append(li);
    }
    select(slots.some(x => x.id === location.hash.slice(1)) ? location.hash.slice(1) : "net");
  </script>
  <script src="field.js?v=1790631535"></script>
</body>
</html>
